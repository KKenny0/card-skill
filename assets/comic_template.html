<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
@font-face{font-family:'Moment Song';src:url('{{FONT_BASE}}/XiangcuiDengcusong.ttf') format('truetype');font-display:block}
:root{--bg:#f4f1eb;--paper:#f4f1eb;--panel:#faf8f3;--white:var(--panel);--tone:var(--panel);--ink:#28251f;--ink-light:#746b60;--gray-dark:#746b60;--gray-mid:#746b60;--hairline:#c8c0b4;--accent:#934b3c;--serif:'Moment Song',serif;--sans:'Moment Song',serif;--marker:'Moment Song',serif;--mono:monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink)}
.card{width:1080px;height:1440px;padding:36px 80px;display:flex;flex-direction:column;font-family:var(--serif);position:relative}
.title-area{flex:none;min-height:112px;text-align:left}.title-area h1{font:400 56px/1.2 var(--serif);margin:0;text-wrap:pretty}.subtitle{font:400 28px/1.5 var(--serif);margin:8px 0 0}
.panels{display:grid;gap:0;flex:1;min-height:0;position:relative;font:400 36px/1.5 var(--serif)}
.comic-art{display:block;width:100%;height:100%;object-fit:contain}
.panel{display:flex;flex-direction:column;gap:16px;border:1px solid var(--hairline);background:var(--panel);position:relative;min-width:0;min-height:0;padding:20px}
.speech-bubble{background:var(--panel);border:1px solid var(--hairline);border-radius:12px;padding:12px 18px;font:400 36px/1.5 var(--serif)}
p{margin:0}.reading-unit{white-space:nowrap}.colophon{flex:none;display:flex;align-items:center;gap:16px;min-height:40px;font:400 24px/1.5 var(--serif);color:var(--ink-light)}.brand-mark{display:flex;align-items:center}.logo-mark{width:32px;height:32px;object-fit:contain}.endmark{min-width:0}
{{CUSTOM_CSS}}
</style></head><body><div class="card">{{HEADER_BLOCK}}{{TITLE_BLOCK}}<div class="panels">{{PANELS_HTML}}</div>{{COLOPHON_BLOCK}}</div></body></html>
