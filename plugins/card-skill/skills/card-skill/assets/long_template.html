<!doctype html><html lang="zh-CN" class="light"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>长页札记</title><style>
@import url('file://{{FONT_BASE}}/local-fonts.css');
@font-face{font-family:'XiangcuiDengcusong';src:url('file://{{FONT_BASE}}/XiangcuiDengcusong.ttf') format('truetype');font-display:block}
:root{--bg:#f4f1eb;--surface-1:#f4f1eb;--surface-2:#f4f1eb;--accent:#87463f;--ink:#282722;--ink-muted:#69645e;--hairline:#d8d2c8;--radius:0px}
*{box-sizing:border-box}html,body{margin:0;width:1080px;background:var(--bg);color:var(--ink);font-family:'XiangcuiDengcusong',serif}.page{padding:76px 84px 88px}.header{border-top:4px solid var(--accent);padding-top:30px;margin-bottom:56px}.kicker{font-size:30px;color:var(--ink-muted);margin-bottom:22px}h1{font-size:64px;line-height:1.3;font-weight:400;margin:0;max-width:900px}.subtitle{font-size:36px;line-height:1.65;color:var(--ink-muted);margin:24px 0 0}.subtitle:empty{display:none}.body-content>p{font-size:42px;line-height:1.85;margin:0 0 30px;text-align:left}h2{font-size:46px;line-height:1.45;font-weight:400;margin:66px 0 26px}h3{font-size:42px;font-weight:400;margin:42px 0 20px}blockquote{margin:44px 0 48px;padding:8px 0 8px 36px;border-left:3px solid var(--accent)}blockquote p{font-size:44px;line-height:1.9;margin:0}.layer-card{margin:36px 0 52px 96px;border-top:1px solid var(--hairline);padding-top:20px}.layer-label{font-size:30px;color:var(--accent);margin-bottom:12px}.layer-text{font-size:36px;line-height:1.75;color:var(--ink-muted)}.highlight{margin:48px 0;padding:0}.highlight p{text-wrap:balance;font-size:48px;line-height:1.6;margin:0}.accent-highlight{color:var(--accent)}.section-break{height:32px;border-bottom:1px solid var(--hairline);margin:12px 0 48px}.section-break span{display:none}.colophon{font-size:28px;color:var(--ink-muted)}.colophon img{width:32px;height:32px}
.layer-card.note-footer{margin:52px 0 0;padding-top:22px}.layer-card.note-footer .layer-text{font-size:36px;line-height:1.7}/* Heading hierarchy remains independent of palette. */
h2{font-size:54px;line-height:1.4;margin:72px 0 26px;padding-bottom:18px;border-bottom:1px solid var(--hairline)}h3{font-size:44px;line-height:1.45;margin:42px 0 20px;color:var(--accent)}blockquote p+p{margin-top:30px}
.dropcap::first-letter{float:left;font-size:76px;line-height:1.1;padding:8px 12px 0 0}.source-line{display:block;font-size:36px;line-height:1.7;color:var(--ink-muted);margin-top:44px}.source-line:empty{display:none}.layer-label:empty,.kicker:empty{display:none}.accent-word{color:var(--accent)}html.dark{--bg:#171715;--surface-1:#242420;--surface-2:#302e28;--accent:#c99380;--ink:#eee8dd;--ink-muted:#c1b9ad;--hairline:#575148;--radius:0px}.reading-phrase{display:inline-block;max-width:100%;overflow-wrap:break-word}</style></head><body><div class="page"><header class="header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></header><div class="body-content">{{BODY_HTML}}</div>{{SOURCE_LINE}}<footer class="colophon"><img src="{{LOGO}}" alt="logo"><span class="name">{{BRAND_NAME}}</span></footer></div></body></html>
